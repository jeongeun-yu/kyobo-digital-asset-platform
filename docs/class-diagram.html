<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Kyobo DAP — Class Diagram</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0d1117; color:#e6edf3; font-family:'Segoe UI',system-ui,sans-serif; }
    header {
      padding:18px 32px 12px; border-bottom:1px solid #21262d;
      display:flex; align-items:baseline; gap:12px;
    }
    header h1 { font-size:17px; font-weight:600; color:#f0f6fc; }
    header small { font-size:12px; color:#484f58; }
    .legend {
      display:flex; gap:18px; flex-wrap:wrap;
      padding:9px 32px; border-bottom:1px solid #21262d; background:#010409;
    }
    .li { display:flex; align-items:center; gap:6px; font-size:12px; color:#8b949e; }
    .dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
    .tabs {
      display:flex; gap:2px; padding:10px 32px 0; flex-wrap:wrap;
      background:#010409; border-bottom:1px solid #21262d;
    }
    .tab {
      padding:6px 14px; font-size:12px; color:#8b949e; cursor:pointer;
      border-radius:6px 6px 0 0; border:1px solid transparent; border-bottom:none;
      transition:all .15s; user-select:none; margin-bottom:-1px;
    }
    .tab:hover { color:#c9d1d9; background:#161b22; }
    .tab.active { color:#e6edf3; background:#0d1117; border-color:#30363d; }
    .panel { display:none; padding:20px 32px 48px; }
    .panel.active { display:block; }
    .wrap {
      background:#161b22; border:1px solid #30363d;
      border-radius:10px; padding:24px; overflow:auto; min-height:200px;
    }
    .wrap svg { max-width:none !important; }
    .wrap { position:relative; }
    .zoom-bar {
      position:absolute; top:12px; right:12px; z-index:10;
      display:flex; gap:4px; align-items:center;
    }
    .zoom-bar button {
      width:28px; height:28px; border:1px solid #30363d; border-radius:6px;
      background:#161b22; color:#c9d1d9; font-size:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; line-height:1;
      transition:background .1s;
    }
    .zoom-bar button:hover { background:#21262d; }
    .zoom-bar span {
      font-size:11px; color:#484f58; width:36px; text-align:center;
    }
    .err { color:#f85149; font-size:13px; font-family:monospace; white-space:pre-wrap; }
    .loading { color:#484f58; font-size:13px; padding:16px; }
  </style>
</head>
<body>

<header>
  <h1>Kyobo Digital Asset Platform</h1>
  <small>internal/ · Class Relationship Diagram</small>
</header>

<div class="legend">
  <div class="li"><div class="dot" style="background:#1f6feb"></div>chain-adapters</div>
  <div class="li"><div class="dot" style="background:#bc8cff"></div>event-engine</div>
  <div class="li"><div class="dot" style="background:#3fb950"></div>vasp</div>
  <div class="li"><div class="dot" style="background:#eab308"></div>core-banking</div>
  <div class="li"><div class="dot" style="background:#f97316"></div>issuer-service</div>
  <div class="li"><div class="dot" style="background:#484f58"></div>interface</div>
  <div class="li" style="margin-left:auto;font-size:11px;color:#484f58">
    ◁|— 상속 &nbsp;·&nbsp; ◁|.. 구현 &nbsp;·&nbsp; ◆— 컴포지션 &nbsp;·&nbsp; ..> 의존
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<script>
// ── Tab/panel factory ──────────────────────────────────────────────────────────
const TABS = [
  { key:'full',    label:'전체 구조'       },
  { key:'chain',   label:'chain-adapters'  },
  { key:'ee',      label:'event-engine'    },
  { key:'vasp',    label:'vasp'            },
  { key:'cb',      label:'core-banking'    },
  { key:'issuer',  label:'issuer-service'  },
  { key:'stream',  label:'Stream Pipeline' },
  { key:'tx',      label:'TX State Machine'},
  { key:'boot',    label:'Bootstrap 주입'  },
];

const tabsEl   = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
TABS.forEach(({key, label}, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.dataset.tab = key;
  tab.textContent = label;
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.id        = 'panel-' + key;
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.innerHTML = '<div class="wrap loading" id="d-' + key + '">렌더링 중...</div>';
  panelsEl.appendChild(panel);
});

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
});

// ── Diagram sources (inline style syntax: class Name:::style { }) ──────────────
const D = {};

// ════════════════════════════════════════════════════════════════════════════════
// 전체 구조
// ════════════════════════════════════════════════════════════════════════════════
D.full = `classDiagram
  direction TB
  classDef iface fill:#1c2230,stroke:#484f58,color:#8b949e
  classDef chain fill:#040f1e,stroke:#1f6feb,color:#79c0ff
  classDef ee    fill:#1e1040,stroke:#bc8cff,color:#e2ccff
  classDef vasp  fill:#0a2a14,stroke:#3fb950,color:#aff5b4
  classDef cb    fill:#2d2a00,stroke:#eab308,color:#fef08a
  classDef comp  fill:#2a0d1e,stroke:#f778ba,color:#ffb3d9
  classDef is    fill:#3d1a00,stroke:#f97316,color:#ffe0b2

  class IBlockchainAdapter:::iface {
    <<interface>>
    +isConnected()
    +getBlockNumber()
    +mintNFT(params)
    +mintNFTBatch(params)
    +burnNFT(params)
    +getBalance(contractAddr, owner, tokenId)
    +getNftHoldings?(contractAddr, address, fromBlock)
    +call(params)
    +sendTransaction(params)
    +getReceipt(txHash)
    +queryEvents(addr, abi, eventName)
    +subscribeEvents(contracts, handler)
  }
  class EVMAdapter:::chain {
    -wallet Wallet|null
    -provider JsonRpcProvider
    +mintNFT(params)
  }
  class AdapterDecorator:::chain {
    <<abstract>>
    #inner IBlockchainAdapter
  }
  class LoggingAdapterDecorator:::chain
  class RetryAdapterDecorator:::chain
  IBlockchainAdapter <|.. EVMAdapter
  IBlockchainAdapter <|.. AdapterDecorator
  AdapterDecorator <|-- LoggingAdapterDecorator
  AdapterDecorator <|-- RetryAdapterDecorator

  class IdempotencyStore:::iface {
    <<interface>>
    +tryMark(key, ttl)
    +unmark(key)
  }
  class EventProcessor:::iface {
    <<interface>>
    +eventTypes string[]
    +process(msg)
  }
  class IEventHandler:::iface {
    <<interface>>
    +handle(event)
  }
  class NFTLedgerService:::iface {
    <<interface>>
    +creditNFT(wallet, tokenId, amount, txHash)
    +getNFTBalance(wallet, tokenId)
  }
  class IActivityIssuer:::iface {
    <<interface>>
    +issueActivityNFT(payload)
  }
  class IdempotencyGuard:::ee {
    -store IdempotencyStore
    +run(key, fn)
  }
  class RedisIdempotencyStore:::ee {
    +tryMark(key, ttl)
    +unmark(key)
  }
  class ChainEventListener:::ee {
    +start()
    +stop()
  }
  class WebhookServer:::ee {
    +on(eventType, handler)
    +listen()
  }
  class WebhookPublishHandler:::ee {
    +createHandler()
  }
  class RedisStreamPublisher:::ee {
    +publish(event)
    +initialize(groupName)
  }
  class ConsumerGroupPool:::ee {
    +start()
    +stop()
  }
  class ConsumerGroupWorker:::ee {
    +start()
    +stop()
  }
  class DLQHandler:::ee {
    +move(item)
  }
  class NFTIssuedProcessor:::ee {
    +process(msg)
  }
  class ActivityProcessor:::ee {
    +process(msg)
  }
  IdempotencyStore <|.. RedisIdempotencyStore
  EventProcessor <|.. NFTIssuedProcessor
  EventProcessor <|.. ActivityProcessor
  IdempotencyGuard *-- IdempotencyStore
  ChainEventListener *-- IBlockchainAdapter
  ChainEventListener *-- IEventHandler
  WebhookPublishHandler *-- RedisStreamPublisher
  WebhookPublishHandler *-- IdempotencyGuard
  ConsumerGroupPool *-- ConsumerGroupWorker
  ConsumerGroupWorker *-- EventProcessor
  ConsumerGroupWorker *-- DLQHandler
  NFTIssuedProcessor *-- IdempotencyGuard
  NFTIssuedProcessor *-- NFTLedgerService
  ActivityProcessor *-- IdempotencyGuard
  ActivityProcessor *-- IActivityIssuer

  class IVASPAdapter:::iface {
    <<interface>>
    +submitTransaction(params)
    +screenAddress(addr)
  }
  class ExternalVASPAdapter:::vasp {
    +submitTransaction(params)
    +screenAddress(addr)
  }
  class TxStateMachineService:::vasp {
    +submitMintRequest(req)
    +handleMined(requestId, blockNumber)
    +handleConfirmed(requestId)
    +handleFinalized(requestId)
    +handleFailed(requestId, reason)
    +pollStaleRequests()
  }
  class PgTxRepository:::is {
    +save(tx)
    +updateStatus(id, status)
  }
  IVASPAdapter <|.. ExternalVASPAdapter
  TxStateMachineService *-- PgTxRepository
  TxStateMachineService ..> IVASPAdapter : submits TX

  class ICoreBankingAdapter:::iface {
    <<interface>>
    +getUserAccount(userId)
    +notifyReward(userId, nftId)
  }
  class KyoboCoreBankingAdapter:::cb {
    +getUserAccount(userId)
    +notifyReward(userId, nftId)
  }
  class InternalGatewayClient:::cb {
    +getUserAccount(userId)
    +health()
  }
  class CircuitBreaker:::cb {
    -state string
    -failures number
    -failureThreshold number
    -recoveryTimeMs number
    +execute(fn)
    +getState()
    +getFailures()
  }
  class LedgerService:::cb {
    +createMintRequest(params)
    +updateMintRequest(id, status)
  }
  ICoreBankingAdapter <|.. KyoboCoreBankingAdapter
  KyoboCoreBankingAdapter *-- InternalGatewayClient
  InternalGatewayClient *-- CircuitBreaker
  LedgerService *-- ICoreBankingAdapter

  class IssuerService:::is {
    +issueActivityNFT(payload)
    +handleVaspTxFailed(params)
  }
  class TokenIssuerFactory:::is {
    +createNFTIssuer(addr, condSvc)
  }
  class EventConditionService:::is {
    +evaluate(event, policy)
  }
  class PgIssuanceRequestRepository:::is {
    +create(req)
    +updateStatus(id, status)
  }
  class IssuanceConfirmHandler:::is {
    +handle(event)
  }
  class PgNFTLedgerService:::is {
    +creditNFT(wallet, tokenId, amount, txHash)
    +getNFTBalance(wallet, tokenId)
  }
  NFTLedgerService <|.. PgNFTLedgerService
  IEventHandler <|.. IssuanceConfirmHandler
  IActivityIssuer <|.. IssuerService
  IssuerService *-- ICoreBankingAdapter
  IssuerService *-- IBlockchainAdapter
  IssuerService *-- EventConditionService
  IssuerService *-- IIssuanceRequestRepository
  IssuerService *-- TxStateMachineService
  IssuerService *-- LedgerService
  PgNFTLedgerService *-- ICoreBankingAdapter
  TokenIssuerFactory ..> IssuerService : creates
  ActivityProcessor ..> IssuerService : calls
  WebhookServer --> WebhookPublishHandler : routes`;

// ════════════════════════════════════════════════════════════════════════════════
// chain-adapters
// ════════════════════════════════════════════════════════════════════════════════
D.chain = `classDiagram
  direction TB
  classDef iface fill:#1c2230,stroke:#484f58,color:#8b949e
  classDef chain fill:#040f1e,stroke:#1f6feb,color:#79c0ff

  class IBlockchainAdapter:::iface {
    <<interface>>
    +chainId string
    +chainType string
    +isConnected()
    +getBlockNumber()
    +mintNFT(params)
    +mintNFTBatch(params)
    +burnNFT(params)
    +getBalance(contractAddr, owner, tokenId)
    +getNftHoldings?(contractAddr, address, fromBlock)
    +call(params)
    +sendTransaction(params)
    +getReceipt(txHash)
    +queryEvents(addr, abi, eventName, fromBlock, toBlock)
    +subscribeEvents(contractAddr, abi, eventNames, fromBlock, handler)
  }
  class AdapterDecorator:::chain {
    <<abstract>>
    #inner IBlockchainAdapter
    +All methods — delegates to inner
  }
  class LoggingAdapterDecorator:::chain {
    +All methods — logs then delegates
  }
  class RetryAdapterDecorator:::chain {
    -maxRetries number
    -delayMs number
    +All methods — retries on failure
  }
  class EVMAdapter:::chain {
    +chainId string
    -wallet Wallet|null
    -provider JsonRpcProvider
    +isConnected()
    +getBlockNumber()
    +mintNFT(params)
    +mintNFTBatch(params)
    +burnNFT(params)
    +getBalance(contractAddr, owner, tokenId)
    +getNftHoldings(contractAddr, address, fromBlock)
    +sendTransaction(params)
    +queryEvents(addr, abi, eventName, fromBlock, toBlock)
    +subscribeEvents(contractAddr, abi, eventNames, fromBlock, handler)
    +getReceipt(txHash)
  }

  IBlockchainAdapter <|.. EVMAdapter
  IBlockchainAdapter <|.. AdapterDecorator
  AdapterDecorator <|-- LoggingAdapterDecorator
  AdapterDecorator <|-- RetryAdapterDecorator`;

// ════════════════════════════════════════════════════════════════════════════════
// event-engine
// ════════════════════════════════════════════════════════════════════════════════
D.ee = `classDiagram
  direction TB
  classDef iface fill:#1c2230,stroke:#484f58,color:#8b949e
  classDef ee    fill:#1e1040,stroke:#bc8cff,color:#e2ccff

  class IdempotencyStore:::iface {
    <<interface>>
    +tryMark(key, ttl)
    +unmark(key)
  }
  class IdempotencyGuard:::ee {
    -store IdempotencyStore
    -ttlSeconds number
    +run(key, fn)
  }
  class RedisIdempotencyStore:::ee {
    -redis RedisClient
    +tryMark(key, ttl)
    +unmark(key)
  }
  IdempotencyStore <|.. RedisIdempotencyStore
  IdempotencyGuard *-- IdempotencyStore

  class WebhookServer:::ee {
    -port number
    -secret string
    +on(eventType, handler)
    +listen()
    +close()
  }
  class WebhookPublishHandler:::ee {
    -publisher RedisStreamPublisher
    -idempotency IdempotencyGuard
    -streamKey string
    +createHandler()
  }
  WebhookPublishHandler *-- IdempotencyGuard
  WebhookServer --> WebhookPublishHandler : registers handler

  class RedisStreamClient:::iface {
    <<interface>>
    +xadd(key, fields)
    +xgroupCreate(key, group, startId)
    +ping()
  }
  class RedisConsumerClient:::iface {
    <<interface>>
    +xreadgroup(group, consumer, streams, count, blockMs)
    +xack(key, group, ids)
    +xautoclaim(key, group, consumer, minIdle, startId)
    +xrange(key, start, end)
  }
  class RedisStreamPublisher:::ee {
    -redis RedisStreamClient
    +publish(event)
    +initialize(groupName)
    +ping()
  }
  class ConsumerGroupWorker:::ee {
    -redis RedisConsumerClient
    -processors EventProcessor[]
    -dlq DLQHandler
    -config WorkerConfig
    +start()
    +stop()
  }
  class ConsumerGroupPool:::ee {
    -workers ConsumerGroupWorker[]
    +start()
    +stop()
  }
  class DLQHandler:::ee {
    -redis RedisConsumerClient
    +move(item)
  }
  RedisStreamPublisher *-- RedisStreamClient
  WebhookPublishHandler *-- RedisStreamPublisher
  ConsumerGroupPool *-- ConsumerGroupWorker
  ConsumerGroupWorker *-- RedisConsumerClient
  ConsumerGroupWorker *-- DLQHandler

  class EventProcessor:::iface {
    <<interface>>
    +eventTypes string[]
    +process(msg)
  }
  class IEventHandler:::iface {
    <<interface>>
    +handle(event)
  }
  class NFTLedgerService:::iface {
    <<interface>>
    +creditNFT(wallet, tokenId, amount, txHash)
    +getNFTBalance(wallet, tokenId)
  }
  class IActivityIssuer:::iface {
    <<interface>>
    +issueActivityNFT(payload)
  }
  class NFTIssuedProcessor:::ee {
    +eventTypes string[]
    -idempotency IdempotencyGuard
    -ledger NFTLedgerService
    +process(msg)
  }
  class ActivityProcessor:::ee {
    +eventTypes string[]
    -idempotency IdempotencyGuard
    -issuer IActivityIssuer
    +process(msg)
  }
  EventProcessor <|.. NFTIssuedProcessor
  EventProcessor <|.. ActivityProcessor
  ConsumerGroupWorker *-- EventProcessor
  NFTIssuedProcessor *-- IdempotencyGuard
  NFTIssuedProcessor *-- NFTLedgerService
  ActivityProcessor *-- IdempotencyGuard
  ActivityProcessor *-- IActivityIssuer

  class BlockStateStore:::iface {
    <<interface>>
    +getLastProcessedBlock()
    +setLastProcessedBlock(block)
  }
  class FinalizedBlockProvider:::iface {
    <<interface>>
    +getFinalizedBlockNumber()
  }
  class ChainEventListener:::ee {
    -adapter IBlockchainAdapter
    -handlers IEventHandler[]
    -contracts ContractConfig[]
    -stateStore BlockStateStore
    +start()
    +stop()
  }
  ChainEventListener *-- IEventHandler
  ChainEventListener *-- BlockStateStore
  NFTIssuedProcessor *-- FinalizedBlockProvider`;

// ════════════════════════════════════════════════════════════════════════════════
// vasp
// ════════════════════════════════════════════════════════════════════════════════
D.vasp = `classDiagram
  direction TB
  classDef iface fill:#1c2230,stroke:#484f58,color:#8b949e
  classDef vasp  fill:#0a2a14,stroke:#3fb950,color:#aff5b4
  classDef is    fill:#3d1a00,stroke:#f97316,color:#ffe0b2

  class IVASPAdapter:::iface {
    <<interface>>
    +submitTransaction(params)
    +screenAddress(addr)
    +createWallet(userId)
    +getWallet(userId)
    +transfer(params)
    +getTransferStatus(id)
  }
  class ExternalVASPAdapter:::vasp {
    -baseUrl string
    -apiKey string
    +submitTransaction(params)
    +screenAddress(addr)
    +createWallet(userId)
    +getWallet(userId)
    +transfer(params)
    +getTransferStatus(id)
  }
  IVASPAdapter <|.. ExternalVASPAdapter

  class TxRepository:::iface {
    <<interface>>
    +save(tx)
    +findById(id)
    +findByTxHash(hash)
    +updateStatus(id, status)
    +findPendingOlderThan(ms)
  }
  class PgTxRepository:::is {
    -pool Pool
    +save(tx)
    +findById(id)
    +findByTxHash(hash)
    +updateStatus(id, status)
    +findPendingOlderThan(ms)
  }
  note for PgTxRepository "issuer-service/infra"
  TxRepository <|.. PgTxRepository

  class VaspTxClient:::iface {
    <<interface>>
    +submitMint(req)
    +getStatus(txHash)
    +resubmitWithGasBump(txHash)
  }
  class VaspTxClientAdapter:::vasp {
    -vaspAdapter IVASPAdapter
    +submitMint(req)
    +getStatus(txHash)
    +resubmitWithGasBump(txHash)
  }
  VaspTxClient <|.. VaspTxClientAdapter
  VaspTxClientAdapter *-- IVASPAdapter

  class WalletResolver:::iface {
    <<interface>>
    +getWalletAddr(userId)
  }
  class TxStateMachineService:::vasp {
    -repo TxRepository
    -vasp VaspTxClient
    -wallet? WalletResolver
    +submitMintRequest(req)
    +handleMined(requestId, blockNumber)
    +handleConfirmed(requestId)
    +handleFinalized(requestId)
    +handleFailed(requestId, reason)
    +handleTimeout(requestId)
    +handleReorg(requestId)
    +pollStaleRequests()
    +getStatus(requestId)
  }
  TxStateMachineService *-- TxRepository
  TxStateMachineService *-- VaspTxClient
  TxStateMachineService *-- WalletResolver
`;

// ════════════════════════════════════════════════════════════════════════════════
// core-banking
// ════════════════════════════════════════════════════════════════════════════════
D.cb = `classDiagram
  direction TB
  classDef iface fill:#1c2230,stroke:#484f58,color:#8b949e
  classDef cb    fill:#2d2a00,stroke:#eab308,color:#fef08a
  classDef is    fill:#3d1a00,stroke:#f97316,color:#ffe0b2

  class ICoreBankingAdapter:::iface {
    <<interface>>
    +getUserAccount(userId)
    +notifyReward(userId, nftId)

  InternalGatewayClient *-- CircuitBreaker

  class DatabaseClient:::iface {

  class PgDatabaseClient:::is {
    -pool Pool

  }
  note for PgDatabaseClient "issuer-service/infra"
  DatabaseClient <|.. PgDatabaseClient

  class LedgerService:::cb {
    -db DatabaseClient
    -coreBanking ICoreBankingAdapter
    +createMintRequest(userId, policyId)
    +getMintRequest(id)

    +updateMintRequest(id, patch)

  class AuditLogService:::cb {

    +queryByResource(type, id)

  class IReconcileService:::iface {
    <<interface>>
    +reconcile()
    +reconcileNftHoldings(userId)
    +reconcileAllNftHoldings()
  }
  class ReconcileService:::cb {
    -coreBanking ICoreBankingAdapter
    +reconcile()
    +reconcileNftHoldings(userId)
    +reconcileAllNftHoldings()
  }
  class PgNftHoldingRepository:::is {
    -pool Pool
    +getHoldings(userId)
    +getAllUserIds()
  }
  note for PgNftHoldingRepository "issuer-service/infra"
  class NotifierAdapter:::iface {
    <<interface>>
    +sendAlert(payload)

const panZoomInstances = {};  // key → svgPanZoom instance
const panZoomReady     = {};  // key → boolean (이미 초기화됐는지)

function attachPanZoom(key, wrapEl) {
  if (panZoomReady[key]) return;
  const svgEl = wrapEl.querySelector('svg');
  if (!svgEl || !window.svgPanZoom) return;

  // 패널이 실제로 표시된 상태에서만 초기화 (hidden이면 크기가 0이라 깨짐)
  if (wrapEl.clientWidth === 0) return;

  panZoomReady[key] = true;

  svgEl.setAttribute('width',  wrapEl.clientWidth);
  svgEl.setAttribute('height', Math.max(wrapEl.clientHeight, 400));

  const instance = svgPanZoom(svgEl, {
    zoomEnabled:          true,
    panEnabled:           true,
    controlIconsEnabled:  false,
    fit:                  true,
    center:               true,
    minZoom:              0.05,
    maxZoom:              20,
    zoomScaleSensitivity: 0.3,
  });
  panZoomInstances[key] = instance;

  // zoom-bar
  const bar = document.createElement('div');
  bar.className = 'zoom-bar';
  const pct = document.createElement('span');
  pct.textContent = '100%';

  function updatePct() { pct.textContent = Math.round(instance.getZoom() * 100) + '%'; }

  const btnIn  = document.createElement('button'); btnIn.title  = '확대'; btnIn.textContent = '+';
  const btnOut = document.createElement('button'); btnOut.title = '축소'; btnOut.textContent = '−';
  const btnRst = document.createElement('button'); btnRst.title = '초기화'; btnRst.textContent = '⊙';

  btnIn.onclick  = () => { instance.zoomIn();  updatePct(); };
  btnOut.onclick = () => { instance.zoomOut(); updatePct(); };
  btnRst.onclick = () => {
    instance.resetZoom(); instance.resetPan();
    instance.fit(); instance.center();
    updatePct();
  };

  svgEl.addEventListener('wheel', () => requestAnimationFrame(updatePct));

  bar.append(btnOut, pct, btnIn, btnRst);
  wrapEl.appendChild(bar);
  requestAnimationFrame(updatePct);
}

// classDef 이름 → 색상 (범례와 동일)
const CLASS_COLORS = {
  iface: { fill: '#1c2230', stroke: '#484f58', text: '#8b949e' },
  chain: { fill: '#0d2d4a', stroke: '#58a6ff', text: '#cae8ff' },
  ee:    { fill: '#1e1040', stroke: '#bc8cff', text: '#e2ccff' },
  vasp:  { fill: '#0a2a14', stroke: '#3fb950', text: '#aff5b4' },
  cb:    { fill: '#2d2a00', stroke: '#eab308', text: '#fef08a' },
  comp:  { fill: '#2a0d1e', stroke: '#f778ba', text: '#ffb3d9' },
  is:    { fill: '#3d1a00', stroke: '#f97316', text: '#ffe0b2' },
};

function injectColors(wrapEl, src) {
  const svgEl = wrapEl.querySelector('svg');
  if (!svgEl) return;

  // class ClassName:::styleKey 파싱 (사용 안 하지만 향후 확장용)
  const re = /^\s*class\s+(\w+):::(\w+)/gm;
  let m; while ((m = re.exec(src)) !== null) {} // just validate src exists

  // 렌더된 SVG에서 styleKey CSS 클래스를 가진 <g id="..."> 를 직접 찾아
  // 실제 ID 기반 CSS 규칙 + DOM 직접 조작으로 이중 적용
  let css = '';

  svgEl.querySelectorAll('g[id]').forEach(g => {
    for (const [styleKey, c] of Object.entries(CLASS_COLORS)) {
      if (!g.classList.contains(styleKey)) continue;

      // ① DOM 직접 조작
      g.querySelectorAll('rect, polygon').forEach(el => {
        el.style.setProperty('fill',   c.fill,   'important');
        el.style.setProperty('stroke', c.stroke, 'important');
      });
      g.querySelectorAll('path').forEach(el => {
        if (el.getAttribute('stroke') === 'none') {
          // 배경 path (solid fill, no stroke)
          el.style.setProperty('fill',   c.fill,   'important');
        } else {
          // 테두리 path
          el.style.setProperty('stroke', c.stroke, 'important');
          el.style.setProperty('fill',   'none',   'important');
        }
      });
      g.querySelectorAll('line').forEach(el =>
        el.style.setProperty('stroke', c.stroke, 'important'));
      g.querySelectorAll('text, tspan').forEach(el =>
        el.style.setProperty('fill', c.text, 'important'));
      g.querySelectorAll('foreignObject *').forEach(el =>
        el.style.setProperty('color', c.text, 'important'));

      // ② ID 기반 CSS 규칙 주입 (이중 보험)
      const id = CSS.escape(g.id);
      css += `#${id} rect,#${id} polygon{fill:${c.fill}!important;stroke:${c.stroke}!important}`;
      css += `#${id} path[stroke="none"]{fill:${c.fill}!important}`;
      css += `#${id} path:not([stroke="none"]){stroke:${c.stroke}!important;fill:none!important}`;
      css += `#${id} line{stroke:${c.stroke}!important}`;
      css += `#${id} text,#${id} tspan{fill:${c.text}!important}`;
      css += `#${id} foreignObject *{color:${c.text}!important}`;
      break;
    }
  });

  if (css) {
    const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    st.textContent = css;
    svgEl.appendChild(st); // 맨 뒤에 추가해야 기존 style 블록보다 나중에 적용됨
  }
}

async function renderAll() {
  let uid = 0;
  for (const [key, src] of Object.entries(D)) {
    const el = document.getElementById('d-' + key);
    if (!el) continue;
    try {
      const { svg } = await mermaid.render('mg-' + (uid++), src);
      el.innerHTML = svg;
      injectColors(el, src);
      el.classList.remove('loading');
      // 첫 번째(active) 패널만 즉시 초기화, 나머지는 탭 클릭 시 lazy 초기화
      attachPanZoom(key, el);
    } catch (err) {
      el.innerHTML = '<div class="err">Mermaid error:\n' + (err.message || err) + '</div>';
      el.classList.remove('loading');
    }
  }
}

  const key = tab.dataset.tab;
  requestAnimationFrame(() => {
    const el = document.getElementById('d-' + key);
    if (!el) return;
    if (!panZoomReady[key]) {
      attachPanZoom(key, el);
    } else {
      const inst = panZoomInstances[key];
      if (inst) { inst.resize(); inst.fit(); inst.center(); }
    }
  });
});

document.addEventListener('DOMContentLoaded', renderAll);
</script>
</body>
</html>
