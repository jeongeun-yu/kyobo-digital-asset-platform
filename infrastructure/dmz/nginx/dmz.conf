# ============================================================================
# DMZ Nginx 설정 — 교보 블록체인 노드 접근 제어
# ============================================================================
# 위치: DMZ 서버 (내부망 ↔ 외부망 경계)
#
# 트래픽 흐름:
#   교보 내부망 → [이 Nginx] → 블록체인 노드 (RPC)
#                             → 외부 VASP API (역방향 프록시)
#
# 허용 포트:
#   8545  — EVM RPC (내부 only)
#   8546  — EVM WebSocket (이벤트 구독)
#   443   — VASP API 역방향 프록시 (TLS)
# ============================================================================

upstream blockchain_node {
    server 10.0.1.10:8545;  # 내부망 블록체인 노드 IP (환경별 변경)
    keepalive 32;
}

upstream blockchain_ws {
    server 10.0.1.10:8546;
    keepalive 32;
}

# ── 내부망 → 노드 RPC (HTTP) ──────────────────────────────────────────────────
server {
    listen 8545;

    # 내부망 IP 대역만 허용 (교보 내부망 CIDR로 변경)
    allow 10.0.0.0/8;
    deny  all;

    location / {
        proxy_pass         http://blockchain_node;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # RPC 메서드 화이트리스트 — 위험 메서드 차단
        # (eth_sendRawTransaction 등 발행 서비스만 허용)
        proxy_pass_request_body on;
        client_max_body_size 1m;
    }
}

# ── 내부망 → 노드 WebSocket (이벤트 구독) ────────────────────────────────────
server {
    listen 8546;

    allow 10.0.0.0/8;
    deny  all;

    location / {
        proxy_pass          http://blockchain_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# ── issuer-service Webhook 수신 (교보 앱 서버 → 발행 서비스) ─────────────────
server {
    listen 443 ssl;
    server_name issuer.kyobo-da.internal;  # 내부 도메인

    ssl_certificate     /etc/ssl/kyobo/server.crt;
    ssl_certificate_key /etc/ssl/kyobo/server.key;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    allow 10.0.0.0/8;
    deny  all;

    location /webhook/ {
        proxy_pass       http://127.0.0.1:3000;  # issuer-service 포트
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }
}
