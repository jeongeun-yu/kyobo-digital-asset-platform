services:

  # ?? 濡쒖뺄 EVM ?몃뱶 (媛쒕컻쨌援먯쑁?? ??????????????????????????????????????????????
  hardhat-node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../blockchain:/app
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"  # RPC
      - "8546:8546"  # WS
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8545"]
      interval: 5s
      retries: 10

  # ?? ?대?留?Java 寃뚯씠?몄썾??????????????????????????????????????????????????????
  internal-ledger:
    build:
      context: ../../internal/internal-ledger
      dockerfile: Dockerfile
    image: kyobo/internal-ledger:local
    container_name: kyobo-internal-ledger
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kyobo_internal
      DB_USERNAME: kyobo
      DB_PASSWORD: kyobo
      CORE_BANKING_URL: http://host.docker.internal:9090
    depends_on:
      - postgres

  # ?? NFT 諛쒗뻾 ?쒕퉬?????????????????????????????????????????????????????????????
  issuer-service:
    build:
      context: ../../internal/apps/issuer-service
      dockerfile: Dockerfile
    environment:
      RPC_URL:                    http://hardhat-node:8545
      CHAIN_ID:                   "31337"
      OPERATOR_PRIVATE_KEY:       ${OPERATOR_PRIVATE_KEY}
      NFT_CONTRACT_ADDR:          ${NFT_CONTRACT_ADDR}
      NFT_ISSUER_ADDR:            ${NFT_ISSUER_ADDR}
      VASP_API_URL:               ${VASP_API_URL}
      VASP_API_KEY:               ${VASP_API_KEY}
      CORE_BANKING_URL:           ${CORE_BANKING_URL}
      CORE_BANKING_CLIENT_ID:     ${CORE_BANKING_CLIENT_ID}
      CORE_BANKING_SECRET:        ${CORE_BANKING_SECRET}
      WEBHOOK_SECRET:             ${WEBHOOK_SECRET}
      WEBHOOK_PORT:               "3000"
    ports:
      - "3000:3000"
    depends_on:
      hardhat-node:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ?? ?곹깭 ??μ냼 ???????????????????????????????????????????????????????????????
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       kyobo_da
      POSTGRES_USER:     kyobo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyobo"]
      interval: 5s
      retries: 10

  # ?? Redis (硫깅벑??媛?? Phase 2+ 罹먯떆) ??????????????????????????????????????
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
