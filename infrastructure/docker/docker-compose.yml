version: '3.9'

# ============================================================================
# 교보 디지털 자산 플랫폼 — 로컬/테스트넷 환경
# 프로덕션은 교보 내부 쿠버네티스 또는 VM 배포 (이 파일 직접 사용 금지)
# ============================================================================

services:

  # ── 로컬 EVM 노드 (개발·교육용) ──────────────────────────────────────────────
  hardhat-node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../blockchain:/app
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"  # RPC
      - "8546:8546"  # WS
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8545"]
      interval: 5s
      retries: 10

  # ── 내부망 Java 게이트웨이 ────────────────────────────────────────────────────
  blockchain-gateway:
    build:
      context: ../../internal/blockchain-gateway
      dockerfile: Dockerfile
    image: kyobo/blockchain-gateway:local
    container_name: kyobo-blockchain-gateway
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kyobo_internal
      DB_USERNAME: kyobo
      DB_PASSWORD: kyobo
      CORE_BANKING_URL: http://host.docker.internal:9090
    depends_on:
      - postgres

  # ── NFT 발행 서비스 ───────────────────────────────────────────────────────────
  issuer-service:
    build:
      context: ../../dmz/apps/issuer-service
      dockerfile: Dockerfile
    environment:
      RPC_URL:                    http://hardhat-node:8545
      CHAIN_ID:                   "31337"
      OPERATOR_PRIVATE_KEY:       ${OPERATOR_PRIVATE_KEY}
      NFT_CONTRACT_ADDR:          ${NFT_CONTRACT_ADDR}
      NFT_ISSUER_ADDR:            ${NFT_ISSUER_ADDR}
      VASP_API_URL:               ${VASP_API_URL}
      VASP_API_KEY:               ${VASP_API_KEY}
      CORE_BANKING_URL:           ${CORE_BANKING_URL}
      CORE_BANKING_CLIENT_ID:     ${CORE_BANKING_CLIENT_ID}
      CORE_BANKING_SECRET:        ${CORE_BANKING_SECRET}
      WEBHOOK_SECRET:             ${WEBHOOK_SECRET}
      WEBHOOK_PORT:               "3000"
    ports:
      - "3000:3000"
    depends_on:
      hardhat-node:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── 상태 저장소 ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       kyobo_da
      POSTGRES_USER:     kyobo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyobo"]
      interval: 5s
      retries: 10

  # ── Redis (멱등성 가드, Phase 2+ 캐시) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
