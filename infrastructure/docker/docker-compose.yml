version: '3.9'

# ============================================================================
# 교보 디지털 자산 플랫폼 — 로컬/테스트넷 환경
# 프로덕션은 교보 내부 쿠버네티스 또는 VM 배포 (이 파일 직접 사용 금지)
#
# 실행:
#   cd infrastructure/docker
#   docker compose --env-file ../../.env up -d
# ============================================================================

services:

  # ── 로컬 EVM 노드 (개발·교육용) ──────────────────────────────────────────────
  hardhat-node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../blockchain:/app
    command: sh -c "npm install --silent && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"  # RPC
      - "8546:8546"  # WS
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8545"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── NFT 발행 서비스 ───────────────────────────────────────────────────────────
  issuer-service:
    build:
      context: ../..
      dockerfile: internal/apps/issuer-service/Dockerfile
    container_name: kyobo-issuer-service
    environment:
      RPC_URL:                http://hardhat-node:8545
      CHAIN_ID:               "31337"
      OPERATOR_PRIVATE_KEY:   ${OPERATOR_PRIVATE_KEY}
      NFT_CONTRACT_ADDR:      ${NFT_CONTRACT_ADDR}
      NFT_ISSUER_ADDR:        ${NFT_ISSUER_ADDR}
      VASP_API_URL:           ${VASP_API_URL}
      VASP_API_KEY:           ${VASP_API_KEY}
      CORE_BANKING_URL:       ${CORE_BANKING_URL}
      CORE_BANKING_SECRET:    ${CORE_BANKING_SECRET}
      WEBHOOK_SECRET:         ${WEBHOOK_SECRET}
      WEBHOOK_PORT:           "3000"
      DATABASE_URL:           postgresql://kyobo:${POSTGRES_PASSWORD}@postgres:5432/kyobo_internal
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3000:3000"
    depends_on:
      hardhat-node:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ── 내부망 Java 게이트웨이 ────────────────────────────────────────────────────
  internal-ledger:
    build:
      context: ../../internal/internal-ledger
      dockerfile: Dockerfile
    image: kyobo/internal-ledger:local
    container_name: kyobo-internal-ledger
    ports:
      - "8080:8080"
    environment:
      DB_URL:       jdbc:postgresql://postgres:5432/kyobo_internal
      DB_USERNAME:  kyobo
      DB_PASSWORD:  ${POSTGRES_PASSWORD}
      CORE_BANKING_URL: http://host.docker.internal:9090
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full  # docker compose --profile full up 으로만 기동

  # ── 상태 저장소 ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kyobo-postgres
    environment:
      POSTGRES_DB:       kyobo_internal
      POSTGRES_USER:     kyobo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyobo -d kyobo_internal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis (멱등성 가드, Phase 2+ 캐시) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kyobo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
